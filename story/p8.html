<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mangione pleaded guilty without a deal, and the state murder trial is now in doubt</title>
</head>
<body>

<style>
:root {
  --paper:      #EEF0F3;
  --surface:    #FFFFFF;
  --surface-2:  #F6F8FA;
  --surface-3:  #E9ECF1;
  --ink:        #101418;
  --ink-2:      #4E5866;
  --ink-3:      #7C8695;
  --rule:       #DBE0E7;
  --rule-soft:  #E6EAEF;
  --cold:       #0B6E7F;
  --cold-ink:   #08525F;
  --cold-soft:  #E0EFF2;
  --hot:        #B4341C;
  --hot-soft:   #F9E8E3;
  --shadow-sm:  0 1px 2px rgba(16,20,24,.06);
  --shadow:     0 2px 4px rgba(16,20,24,.05), 0 10px 28px -14px rgba(16,20,24,.22);
  --pop:        0 4px 12px rgba(16,20,24,.14), 0 12px 32px -12px rgba(16,20,24,.3);

  --font-display: "Superclarendon", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, monospace;
  --maxread: 64ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1015; --surface: #141A21; --surface-2: #1A212A; --surface-3: #202934;
    --ink: #E8EDF2; --ink-2: #9AA6B4; --ink-3: #6B7684;
    --rule: #273039; --rule-soft: #1E252D;
    --cold: #4FC3D6; --cold-ink: #8FDDEA; --cold-soft: #0E2C34;
    --hot: #E8785C; --hot-soft: #331C17;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow: 0 2px 4px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    --pop: 0 4px 12px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --paper: #0C1015; --surface: #141A21; --surface-2: #1A212A; --surface-3: #202934;
  --ink: #E8EDF2; --ink-2: #9AA6B4; --ink-3: #6B7684;
  --rule: #273039; --rule-soft: #1E252D;
  --cold: #4FC3D6; --cold-ink: #8FDDEA; --cold-soft: #0E2C34;
  --hot: #E8785C; --hot-soft: #331C17;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow: 0 2px 4px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  --pop: 0 4px 12px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.8);
}

* { box-sizing: border-box; }
html { overflow-x: clip; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip; max-width: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--cold-ink); }
:focus-visible { outline: 2px solid var(--cold); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--cold-soft); color: var(--cold-ink); }

/* ============ sticky chrome ============ */
.bar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { max-width: 780px; margin: 0 auto; padding: 12px 16px 0; }
.bar-top { display: flex; align-items: center; gap: 12px; }
.mark { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.mark-link { color: var(--ink); text-decoration: none; }
.mark-gap { color: var(--hot); }
.tagline {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .03em;
  color: var(--ink-3); text-transform: uppercase;
}
.topics { display: flex; gap: 6px; padding: 11px 0 10px; overflow-x: auto; scrollbar-width: none; }
.topics::-webkit-scrollbar { display: none; }
.topic {
  flex: none; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-2); padding: 6px 11px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
  transition: border-color .12s, color .12s, background .12s; white-space: nowrap;
}
.topic:hover { border-color: var(--ink-3); color: var(--ink); }
.topic[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.topic-n { opacity: .5; margin-left: 5px; font-variant-numeric: tabular-nums; }

/* ============ feed ============ */
.feed { max-width: 780px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.feed > * { min-width: 0; }
.count {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3); padding: 0 2px 2px;
}

/* ---- paste-a-URL intake ---- */
.intake {
  background: var(--surface); border: 1px dashed color-mix(in srgb, var(--cold) 45%, var(--rule));
  border-radius: 7px; padding: 14px;
}
.intake-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 11px; }
.intake-t { font-family: var(--font-display); font-size: 15px; }
.intake-s { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; color: var(--ink-3); text-transform: uppercase; }
.intake-form input { font-size: 14px; }
.pipe { display: flex; flex-direction: column; gap: 7px; }
.pstep {
  display: flex; align-items: center; gap: 9px; font-family: var(--font-mono); font-size: 11.5px;
  color: var(--ink-3); letter-spacing: .02em; transition: color .2s;
}
.pstep.done { color: var(--ink-2); } .pstep.now { color: var(--cold); }
.pdot { width: 13px; display: inline-grid; place-items: center; font-size: 10px; }
.pipe-out .sub { margin-bottom: 5px; }
.pipe-url {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--cold-ink);
  background: var(--cold-soft); padding: 8px 10px; border-radius: 4px; word-break: break-all;
}
.pipe-out .ask-p { font-size: 14px; }

/* ---- posts + voting ---- */
.post {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 7px;
  box-shadow: var(--shadow-sm); transition: box-shadow .14s, border-color .14s;
  min-width: 0;
}
.post:hover { border-color: color-mix(in srgb, var(--ink-3) 45%, var(--rule)); }
.post[data-open="true"] { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--cold) 35%, var(--rule)); }

.head {
  display: grid; grid-template-columns: 72px 1fr 16px; gap: 14px; align-items: start;
  width: 100%; text-align: left; padding: 14px;
}
.head { color: inherit; text-decoration: none; }
.thumb {
  width: 72px; height: 72px; border-radius: 5px; background: var(--cold-soft);
  display: grid; place-items: center; color: var(--cold); flex: none;
  border: 1px solid color-mix(in srgb, var(--cold) 18%, transparent);
}
.thumb svg { width: 44px; height: 44px; display: block; }
.hmeta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
}
.cat { color: var(--cold); font-weight: 600; }
.htitle {
  font-family: var(--font-display); font-size: 19px; line-height: 1.24;
  letter-spacing: -.012em; margin: 0 0 6px; text-wrap: balance;
}
.hdek {
  font-size: 14.5px; line-height: 1.45; color: var(--ink-2); margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.post[data-open="true"] .hdek { -webkit-line-clamp: unset; }
.hfoot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 9px;
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.qpill {
  color: var(--hot); background: var(--hot-soft);
  border: 1px solid color-mix(in srgb, var(--hot) 24%, transparent);
  padding: 2px 6px; border-radius: 3px; font-weight: 600;
}
.caret { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); transition: transform .18s ease; padding-top: 2px; }
.post[data-open="true"] .caret { transform: rotate(90deg); }

/* ============ expanded body ============ */
.body { padding: 0 20px 18px; }
.divider { height: 1px; background: var(--rule-soft); margin: 2px 0 16px; }

.brief { display: flex; flex-direction: column; gap: 11px; max-width: var(--maxread); }
.brief p { margin: 0; font-size: 16px; line-height: 1.55; }
.tag-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.brief-tag {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--cold); background: var(--cold-soft); padding: 4px 8px; border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
/* "briefed from N sources" — the answer to "where does this come from?",
   visible before a reader has scrolled anywhere */
.src-jump {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-3); background: none; border: none; cursor: pointer; padding: 4px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--cold) 35%, transparent);
}
.src-jump:hover { color: var(--cold); border-bottom-color: var(--cold); }
/* Key figures, demoted from hero tiles to a quiet footnote line. Two testers
   independently found the big tiles context-free; numbers now read as an
   aside under the brief, not a headline act. */
.nums {
  display: flex; flex-wrap: wrap; column-gap: 18px; row-gap: 4px; margin-top: 12px;
  font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: var(--ink-3);
}
.nums-h { letter-spacing: .09em; text-transform: uppercase; color: var(--cold); }
.num-v { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- sources modal (opened from "briefed from N sources") ---- */
.modal-wrap {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: color-mix(in srgb, #000 44%, transparent); padding: 18px;
}
.modal {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--pop); width: min(560px, 100%); max-height: 80vh;
  display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px;
  border-bottom: 1px solid var(--rule-soft);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-2);
}
.modal-head .dd-n { margin-left: 0; }
.modal-x {
  margin-left: auto; font-size: 13px; color: var(--ink-3); padding: 2px 6px; border-radius: 4px;
}
.modal-x:hover { color: var(--ink); background: var(--surface-3); }
.modal-body { padding: 12px 14px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.modal-sub {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--rule-soft);
}
details.dd { border: 1px solid var(--rule); border-radius: 5px; background: var(--surface-2); }
details.dd > summary {
  list-style: none; cursor: pointer; padding: 8px 11px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-2); display: flex; align-items: center; gap: 8px;
}
details.dd > summary::-webkit-details-marker { display: none; }
details.dd > summary::before { content: "+"; color: var(--cold); font-size: 12px; width: 9px; }
details.dd[open] > summary::before { content: "−"; }
details.dd > summary:hover { color: var(--ink); }
.dd-n { margin-left: auto; opacity: .6; font-variant-numeric: tabular-nums; }
.dd-body { padding: 2px 11px 10px; display: flex; flex-direction: column; gap: 7px; }
.ref { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.4; }
.ref-n {
  font-family: var(--font-mono); font-size: 10px; color: var(--cold);
  font-variant-numeric: tabular-nums; padding-top: 2px;
}
.ref a { text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--cold) 35%, transparent); }
.ref a:hover { border-bottom-color: var(--cold); }
.ref-o { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.caveat { font-family: var(--font-mono); font-size: 9.5px; line-height: 1.6; color: var(--ink-3); padding: 6px 11px 2px; }
.ref-k { font-family: var(--font-mono); font-size: 9px; letter-spacing: .05em; text-transform: uppercase; color: var(--cold-ink); background: var(--cold-soft); border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; cursor: help; }

/* ---- inline citation markers ---- */
.cw { position: relative; display: inline-block; }
.cite {
  font-family: var(--font-mono); font-size: 9.5px; text-decoration: none;
  color: var(--cold); background: var(--cold-soft); border-radius: 2px;
  padding: 1px 3px; margin-left: 2px; vertical-align: 1.5px; line-height: 1.4;
  border: 1px solid transparent; cursor: pointer;
}
.cite:hover { border-color: color-mix(in srgb, var(--cold) 45%, transparent); }
.cw.open .cite { border-color: var(--cold); }
.pop {
  position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  width: 244px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 5px; box-shadow: var(--pop);
  padding: 9px 11px; font-size: 12.5px; line-height: 1.42; font-family: var(--font-body);
  opacity: 0; visibility: hidden; transition: opacity .12s; z-index: 60; pointer-events: none;
  text-align: left; text-transform: none; letter-spacing: 0;
}
/* v19: tap-to-open — hover fails on touch, and the marker itself no longer
   navigates; the popup carries the real link instead */
.cw:hover .pop, .cw:focus-within .pop, .cw.open .pop { opacity: 1; visibility: visible; pointer-events: auto; }
.pop-o {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--cold); display: block; margin-bottom: 3px;
}
.pop-u { font-family: var(--font-mono); font-size: 10px; color: var(--cold-ink); display: block; margin-top: 5px; word-break: break-all; text-decoration: underline; text-underline-offset: 2px; }

/* ============ the gap + question grid ============ */
.gap { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; }
.gap-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--hot); font-weight: 600; }
.gap-note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
.gap-rule { flex: 1; height: 1px; background: var(--rule); }

/* v17: the gap is a conversation. Your chosen question renders as a sent
   bubble, the cold answer as a received one, and the next questions arrive
   as quick-reply pills — deeper first, then change-direction. The
   transcript accumulates, so the reader's line of inquiry stays visible. */
.msg { max-width: 92%; border-radius: 14px; margin-top: 10px; }
/* v18 type theme: three voices, three fonts. The slab display is the
   record's frame (headlines, structure); the mono is measurement (meta,
   labels); the conversation — the reader asking, the record answering —
   reads in the body sans at messaging scale. Bubbles and pills therefore
   carry --font-body, never the display face. */
.msg-you {
  margin-left: auto; width: fit-content; background: var(--cold); color: var(--paper);
  border-bottom-right-radius: 4px; padding: 9px 13px;
  font-family: var(--font-body); font-size: 14px; font-weight: 600; line-height: 1.45;
  scroll-margin-top: 104px;
}
.msg-t {
  margin-right: auto; background: var(--surface-2); border: 1px solid var(--rule);
  border-bottom-left-radius: 4px; padding: 13px 15px;
}
.msg-t > p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); max-width: var(--maxread); }
.msg-t .ans { margin-top: 0; background: none; border: none; padding: 0; border-radius: 0; }
.msg-t .deep-m { margin-top: 9px; }
.chip-h { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 0; }
.chat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip-q {
  text-align: left; border: 1px solid color-mix(in srgb, var(--cold) 55%, var(--rule));
  color: var(--cold-ink); border-radius: 16px; padding: 8px 13px; background: var(--surface);
  font-family: var(--font-body); font-size: 13.5px; font-weight: 500; line-height: 1.4; max-width: 100%;
  display: flex; align-items: baseline; gap: 10px; transition: background .12s, border-color .12s;
}
.chip-q:hover { background: var(--cold-soft); border-color: var(--cold); }
.chip-q .chip-m { flex: none; }
.chat-done { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; }
.lens {
  font-family: var(--font-body); font-size: 11.5px; letter-spacing: .01em;
  color: var(--ink-2); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 7px;
  white-space: nowrap; background: var(--surface); cursor: help;
}

/* record evolution — the two-track record made visible: claims enter as
   developing and graduate to settled, or get revised in the open */
.rec { margin: 18px 0 4px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface-2); }
.rec summary { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--cold-ink); }
.rec summary::-webkit-details-marker { display: none; }
.rec-intro { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); padding: 0 12px 8px; margin: 0; }
.rec-row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--rule-soft); }
.rec-when { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); padding-top: 2px; }
.rec-claim { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
.rec-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
.rec-basis { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
.rec-st { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; }
.rec-st.held { color: var(--cold-ink); background: var(--cold-soft); }
.rec-st.revised { color: var(--hot); background: var(--hot-soft); }
.rec-note { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
@media (max-width: 640px) { .rec-row { grid-template-columns: 1fr; gap: 3px; } }

/* topic navigation, spatial: the past above (How we got here, a timeline
   into today), depth in the middle (the gap), connected stories at the exit.
   v12: the arc is now the explicit newcomer on-ramp — a collapsed panel right
   under the read, labelled as the catch-up, skippable by people already
   following the story. */
details.onramp { margin: 14px 0 18px; border-color: color-mix(in srgb, var(--cold) 22%, var(--rule)); }
details.onramp > summary { padding: 10px 14px; }
.onramp-t { text-transform: none; letter-spacing: 0; font-family: inherit; font-size: 12.5px; color: var(--ink-2); }
.onramp-t b { color: var(--ink); font-weight: 600; }
.arc { margin: 0; border: none; border-radius: 0; background: transparent; padding: 2px 11px 8px; }
.arc-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.arc-q { font-family: var(--font-display); font-size: 15px; color: var(--ink); }
/* v13: vertical timeline. The horizontal card strip hid later nodes behind a
   scroll and cramped each claim into a 200px card; a reader-tester called it
   hard to navigate and the one-liners too thin. Vertical gives every node the
   full reading measure and shows the whole arc at a glance. */
.arc-track { display: flex; flex-direction: column; margin: 2px 0 0 5px; max-width: var(--maxread); }
.arc-node { position: relative; border-left: 2px solid var(--rule); padding: 5px 8px 13px 16px; display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
.arc-node::before { content: ''; position: absolute; left: -5px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--ink-3); }
.arc-node:last-child { padding-bottom: 5px; }
.arc-when { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--cold-ink); padding-top: 2px; }
.arc-claim { display: block; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.arc-today { border-left-color: var(--cold); background: var(--cold-soft); border-radius: 0 6px 6px 0; }
.arc-today::before { border-color: var(--cold); background: var(--cold); }
.arc-today .arc-claim { color: var(--cold-ink); font-weight: 600; }
@media (max-width: 480px) { .arc-node { grid-template-columns: 1fr; gap: 2px; } }
.arc-fight { margin-top: 8px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }

function cites(story, arr) {

  return { words, mins: Math.max(1, Math.round(words / WPM)) };

  if (s.deep) words += count(s.deep.standfirst) + deepStats(s.deep).words;

  if (elapsed < day) return `${Math.floor(elapsed / hour)}h`;
  if (elapsed < week) return `${Math.floor(elapsed / day)}d`;
  return `${Math.floor(elapsed / week)}w`;
}

/* ---- topic navigation: up, down, sideways ----
   No story is a singleton. UP climbs to the chain of events and the principle
   in tension underneath; SIDEWAYS crosses to connected stories in this feed;
   DOWN is the gap — the question grid below. UP arcs and SIDEWAYS links
   cover all 26 stories. */
const UP = {
  "p8": {
    "q": "How did a death penalty case end in a plea to stalking?",
    "arc": [
      {
        "when": "4 Dec 2024",
        "claim": "Brian Thompson, chief executive of UnitedHealthcare, is killed in Midtown Manhattan."
      },
      {
        "when": "Jan 2026",
        "claim": "A federal judge dismisses the murder count and the death penalty notice, holding the other counts do not qualify as crimes of violence."
      },
      {
        "when": "14 Aug 2026",
        "claim": "Mangione pleads guilty to two stalking counts with no agreement, and admits the shooting in open court."
      },
      {
        "when": "8 Sept 2026",
        "claim": "Jury selection is due to begin in the New York state murder case, with a motion to dismiss expected first."
      },
      {
        "when": "18 Dec 2026",
        "claim": "Federal sentencing, with guidelines calculated at about 24 to 30 years and prosecutors asking for life."
      }
    ],
    "principle": "Whether the same killing can be tried twice, once by each government."
  }
}; // @UP
const SIDE = {
  "p8": [
    {
      "id": "p7",
      "why": "The other court fight this week running against a fixed date"
    },
    {
      "id": "p3",
      "why": "A case decided on what a statute covers rather than on the conduct"
    }
  ]
}; // @SIDE

/* Navigation is spatial, not labeled: the past sits above the questions
   (How we got here, a timeline that reads left-to-right into today), depth
   sits in the middle (the gap and its go-deeper threads), and connected
   stories sit at the exit, where what-next intent actually lives. The
   reader never needs to learn an axis vocabulary. */
/* The arc doubles as the newcomer on-ramp: readers already following the
   story scroll past one quiet row; readers arriving fresh get the catch-up
   before the gap asks them what coverage missed. */
function arcStrip(s) {
  const up = UP[s.id];
  if (!up) return '';
  return `<details class="dd onramp" data-dd="arc::${s.id}"${ddOpen('arc::' + s.id) ? ' open' : ''}>
    <summary><span class="onramp-t"><b>New to this story?</b> How we got here — the catch-up</span>
      <span class="dd-n">${up.arc.length} moments</span></summary>
    <div class="arc">
    <div class="arc-h"><span class="arc-q">${esc(up.q)}</span></div>
    <div class="arc-track">
      ${up.arc.map(r => `<div class="arc-node"><span class="arc-when">${esc(r.when)}</span><span class="arc-claim">${esc(r.claim)}</span></div>`).join('')}
      <div class="arc-node arc-today"><span class="arc-when">Today</span><span class="arc-claim">${esc(s.headline)}</span></div>
    </div>
    <div class="arc-fight"><span class="arc-tag2">The fight underneath</span>${esc(up.principle)}</div>
  </div></details>`;
}

function connRail(s) {
  const side = SIDE[s.id];
  if (!side || !side.length) return '';
  return `<div class="conn">
    <div class="conn-h">Where this story goes next</div>
    ${side.map(l => { const t = DATA.find(x => x.id === l.id); if (!t) return '';
      return `<a class="conn-card" href="${PAGE_STORY_ID ? '' : 'story/'}${l.id}.html">
        <span class="conn-why">${esc(l.why)}</span>
        <span class="conn-head">${esc(t.headline)}</span>
        <span class="conn-meta">${esc(t.catLabel)} · ${t.questionsCount ?? t.questions.length} unasked questions</span>
      </a>`; }).join('')}
  </div>`;
}

/* The two-track record (developing → settled), demonstrated on a story whose
   record genuinely evolved in public. Each dated claim carries what it rested
   on and its current status — readers watch the record firm up or get revised. */
function recPanel(s) {
  return `<details class="rec" data-dd="rec::${s.id}"${ddOpen('rec::' + s.id, true) ? ' open' : ''}>
    <summary>How this record evolved<span class="dd-n">${s.record.length}</span></summary>
    ${s.record.map(r => `<div class="rec-row"><span class="rec-when">${esc(r.when)}</span><span>
      <span class="rec-claim">${esc(r.claim)}${cites(s, r.c)}</span>
      <span class="rec-meta"><span class="rec-basis">${esc(r.basis)}</span>
        <span class="rec-st ${r.status === 'held' ? 'held' : 'revised'}">${r.status === 'held' ? 'Held' : 'Revised'}</span></span>
      ${r.note ? `<div class="rec-note">${esc(r.note)}</div>` : ''}</span></div>`).join('')}
  </details>`;
}

/* v12 reading model: one progressive reading surface. The brief is the opening
   of the story, the full read continues it in place, and the catch-up sits
   beside them for readers arriving fresh — depth is chosen, never scattered. */
function numsRow(s) {
  if (!s.stats || !s.stats.length) return '';
  return `<div class="nums"><span class="nums-h">By the numbers</span>${s.stats.map(t =>
    `<span><span class="num-v">${esc(t[0])}</span> ${esc(t[1])}</span>`).join('')}</div>`;
}

function body(s) {
  return `<div class="body">
    <div class="divider"></div>
    <div class="tag-row"><span class="brief-tag">${readTag(s)}</span>
      <button class="src-jump" data-srcjump="1" title="Every figure below is traced to one of these sources">briefed from ${s.refs.length} sources</button></div>
    ${arcStrip(s)}
    <div class="brief">${s.brief.map(p => `<p>${p}</p>`).join('')}</div>
    ${s.deep ? `<div class="full">
      <p class="long-standfirst">${s.deep.standfirst}</p>
      ${s.deep.sections.map(sec => `<section class="long-sec"><h3 class="long-h">${esc(sec.h)}</h3>
        ${sec.p.map(p => `<p>${p}</p>`).join('')}</section>`).join('')}
    </div>` : ''}
    ${numsRow(s)}
    ${s.record ? recPanel(s) : ''}

    <div class="gap">
      <span class="gap-label">The gap</span>
      <span class="gap-note">${s.questions.length} questions the coverage didn't answer — where nobody asks, and where the sides split</span>
      <span class="gap-rule"></span>
    </div>

    ${chatFlow(s)}

    ${connRail(s)}
  </div>`;
}

/* Sources live behind the "briefed from N sources" tap as a modal — the
   in-body panels were pure vertical height once every answer's citation
   markers already reveal their source on hover. */
function openSources(s) {
  modalRoot.innerHTML = `<div class="modal-wrap" role="dialog" aria-modal="true" aria-label="Sources: ${esc(s.headline)}">
    <div class="modal">
      <div class="modal-head"><span>Sources</span><span class="dd-n">${s.refs.length}</span>
        <button class="modal-x" aria-label="Close">✕</button></div>
      <div class="modal-body">
        ${s.refs.map((r,i) => `<div class="ref"><span class="ref-n">${i+1}</span><span>
          <a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.t)}</a>
          <span class="ref-o"> · ${esc(r.o)}</span>${r.k && KIND[r.k] ? `<span class="ref-k" title="${esc(KIND[r.k].why)}">${KIND[r.k].chip}</span>` : ''}</span></div>`).join('')}
        ${s.reading && s.reading.length ? `<div class="modal-sub">Related reading</div>
        ${s.reading.map(r => `<div class="ref"><span class="ref-n">→</span><span>
          <a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.t)}</a>
          <span class="ref-o"> · ${esc(r.o)}</span></span></div>`).join('')}` : ''}
      </div>
    </div></div>`;
  document.body.style.overflow = 'hidden';
  modalRoot.querySelector('.modal-x').focus();
}
function closeSources() { modalRoot.innerHTML = ''; document.body.style.overflow = ''; }

function answer(s, q, i) {
  const a = q.ans;
  return `<div class="ans">
    <div class="ans-meta">
      <span><b>Research pass</b></span><span>${a.n} sources · ${a.p} primary</span>
      <span title="${esc(confBasis(a))}">confidence: <span class="${confClass(a.conf)}">${a.conf}</span>
        <span class="conf-why">${esc(confBasis(a))}</span></span><span>verified ${esc(a.v)}</span>
    </div>
    <div class="ans-lead">${a.lead}${cites(s, a.c)}</div>

    <div><div class="sub">What the record shows</div>
      <ul class="facts">${a.facts.map(f => `<li><span>${f.t}${cites(s, f.c)}</span></li>`).join('')}</ul></div>

    ${a.quote ? `<div class="quote">“${esc(a.quote.t)}”<span class="quote-w">${esc(a.quote.w)}</span></div>` : ''}

    <div class="blk-hot"><div class="sub">Where opinions diverge</div><div class="txt">${a.contested}</div></div>
    <div class="blk-cold"><div class="sub">What would change this answer</div><div class="txt">${a.falsify}</div></div>
  </div>`;
}

/* v17: the gap as a conversation. The reader's chosen questions render as
   sent bubbles, each cold answer as a received one, and what's still
   askable arrives as quick-reply pills — the question's own go-deeper
   threads first, then unasked gap questions as a change of direction.
   The transcript accumulates per story (session state, like the old
   open-tile state), so a reader's line of inquiry stays on the page. */
function chatFlow(s) {
  const seq = chatSeq[s.id] || [];
  const askedQ = new Set(seq.filter(k => k[0] === 'q').map(k => +k.slice(1)));
  const askedD = new Set(seq.filter(k => k[0] === 'd'));
  /* pills sort by heat so the genuinely-avoided questions lead */
  const qOrder = s.questions.map((q, i) => [q, i]).sort((a, b) => b[0].heat - a[0].heat);
  /* v18: lens/heat chips hidden from pills — labels where the reader is
     choosing read as clutter. Data retained; the motive survives as a
     hover title, and the answer's meta line still carries provenance. */
  const qPill = ([q, i]) => `<button class="chip-q" data-chat="q${i}" title="Question written from the ${esc(q.lens)} viewpoint — ${esc(motive(q.lens))}">${esc(q.q)}</button>`;
  const dPill = (qi, d, j) => `<button class="chip-q" data-chat="d${qi}-${j}"><span>${esc(d.q)}</span><span class="chip-m">${d.secs}s</span></button>`;

  let flow = `<div class="msg msg-t"><p>Ask one. Each has been researched against the record — every figure traced to a source, or marked as having none.</p></div>`;
  seq.forEach(k => {
    if (k[0] === 'q') {
      const i = +k.slice(1), q = s.questions[i];
      if (!q) return;
      flow += `<div class="msg msg-you">${esc(q.q)}</div>
        <div class="msg msg-t">${answer(s, q, i)}</div>`;
    } else {
      const [qi, j] = k.slice(1).split('-').map(Number);
      const q = s.questions[qi], d = q && q.deeper[j];
      if (!d) return;
      flow += `<div class="msg msg-you">${esc(d.q)}</div>
        <div class="msg msg-t"><div class="deep-t"><p>${d.a}${cites(s, d.c)}</p></div>
          <div class="deep-m">${d.secs}s read</div></div>`;
    }
  });

  const lastK = seq[seq.length - 1];
  const unaskedQ = qOrder.filter(([q, i]) => !askedQ.has(i));
  let pills = '';
  if (!lastK) {
    pills = `<div class="chip-h">Pick your first question</div>
      <div class="chat-chips">${unaskedQ.map(qPill).join('')}</div>`;
  } else {
    const qi = +(lastK[0] === 'q' ? lastK.slice(1) : lastK.slice(1).split('-')[0]);
    const q = s.questions[qi];
    const deeper = q.deeper.map((d, j) => [d, j]).filter(([d, j]) => !askedD.has('d' + qi + '-' + j));
    pills = (deeper.length ? `<div class="chip-h">Ask a follow-up</div>
        <div class="chat-chips">${deeper.map(([d, j]) => dPill(qi, d, j)).join('')}</div>` : '')
      + (unaskedQ.length ? `<div class="chip-h">${deeper.length ? 'Or change direction' : 'This thread is done — change direction'}</div>
        <div class="chat-chips">${unaskedQ.slice(0, 3).map(qPill).join('')}</div>` : '')
      + (!deeper.length && !unaskedQ.length ? `<div class="chat-done">You've asked everything here. The transcript above is your record — or move on to a connected story below.</div>` : '');
  }
  return flow + pills;
}
/* Comments are hidden for now (product decision, Aug 14) — the comments()
   renderer, seeded threads, and composer handler are kept intact so the
   discussion layer can be re-enabled by re-adding the .talk block here. */

function comments(key, seeded) {
  const all = seeded.concat(extraComments[key] || []);
  if (!all.length) return `<div class="empty">No comments yet. Be the first to push back — on the framing, not the facts.</div>`;
  return `<div class="cmt">` + all.map((c, i) => `<div class="cmt-row">
    <div class="cmt-l"></div>
    <div><div class="cmt-h"><span class="av">${esc(initials(c.who))}</span><b>${esc(c.who)}</b> · ${esc(c.when)}</div>
    <div class="cmt-t">${esc(c.text)}</div></div></div>`).join('') + `</div>`;
}

/* ---- interactions ---- */
feedEl.addEventListener('click', e => {
  /* citation markers toggle their source popup (hover fails on touch);
     any other click closes whatever popup is open */
  const citeBtn = e.target.closest('[data-cite]');
  if (citeBtn) {
    const cw = citeBtn.closest('.cw');
    feedEl.querySelectorAll('.cw.open').forEach(x => { if (x !== cw) x.classList.remove('open'); });
    cw.classList.toggle('open');
    return;
  }
  feedEl.querySelectorAll('.cw.open').forEach(x => x.classList.remove('open'));

  if (e.target.closest('a')) return;
  if (e.target.closest('[data-clear]')) { intake = null; render(); return; }
  if (e.target.closest('summary')) return;

  const art = e.target.closest('.post'); if (!art) return;
  const id = art.dataset.id;

  if (e.target.closest('[data-srcjump]')) {
    const s = DATA.find(x => x.id === id);
    if (s) openSources(s);
    return;
  }

  const chat = e.target.closest('[data-chat]');
  if (chat) {
    /* static site: content is pre-researched, so the answer arrives
       instantly — no pretend research pass */
    const seq = chatSeq[id] = chatSeq[id] || [];
    if (seq[seq.length - 1] !== chat.dataset.chat) seq.push(chat.dataset.chat);
    render();
    const asks = feedEl.querySelectorAll(`.post[data-id="${CSS.escape(id)}"] .msg-you`);
    const lastAsk = asks[asks.length - 1];
    if (lastAsk) lastAsk.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }
});

/* sources modal open/close */
const modalRoot = document.getElementById('modalRoot');
modalRoot.addEventListener('click', e => {
  if (e.target.classList.contains('modal-wrap') || e.target.closest('.modal-x')) closeSources();
});
addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.firstChild) closeSources(); });

/* the charter lives on its own page: #charter swaps the feed out for it */
const charterEl = document.getElementById('charterPage');
const footEl = document.querySelector('.foot-min');
function route() {
  if (PAGE_STORY_ID) return;
  const onCharter = location.hash === '#charter';
  charterEl.hidden = !onCharter;
  feedEl.style.display = onCharter ? 'none' : '';
  if (topEl) topEl.style.display = onCharter ? 'none' : '';
  if (footEl) footEl.style.display = onCharter ? 'none' : '';
  if (onCharter) scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();

/* details open-state survives re-renders (toggle doesn't bubble — capture) */
feedEl.addEventListener('toggle', e => {
  const key = e.target.dataset && e.target.dataset.dd;
  if (key) ddState[key] = e.target.open;
}, true);

feedEl.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, input = form.querySelector('input'), val = input.value.trim();
  if (!val) return;

  if (form.dataset.intake) {
    intake = { url: val, stage: 0 };
    render();
    const tick = () => {
      intake.stage++;
      render();
      if (intake.stage < STAGES.length) setTimeout(tick, reduced ? 0 : 620);
    };
    setTimeout(tick, reduced ? 0 : 620);
    return;
  }
  if (form.dataset.cmt) {
    (extraComments[form.dataset.cmt] ||= []).push({ who: 'You', when: 'just now', score: 27, text: val, score: 1 });
    render();
    return;
  }
  const out = form.parentElement.querySelector('[data-askout]');
  input.value = '';
  out.innerHTML = `<div class="working" style="margin-top:11px"><span class="dot"></span>researching “${esc(val)}”…</div>`;
  setTimeout(() => {
    out.innerHTML = `<div class="deep-a"><div class="deep-q">${esc(val)}</div><div class="deep-t">In the live product this comes back with a sourced answer in about twenty seconds and posts it to the thread for everyone. This prototype ships with pre-researched answers only — open any question above to see the format a real answer arrives in.</div></div>`;
  }, reduced ? 0 : 1100);
});

renderTopics();
render();
</script>
</body>
</html>
